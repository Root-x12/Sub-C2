[workspace]
resolver = "2"
members = [
    "oxide-common",
    "oxide-macros",
    "oxide-server",
    "oxide-agent",
    "oxide-tui",
]

[workspace.dependencies]
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
anyhow       = "1"
rand         = "0.8"
hex          = "0.4"
uuid         = { version = "1", features = ["v4", "serde"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono       = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level       = 3
strip           = true
lto             = true
codegen-units   = 1
panic           = "abort"
