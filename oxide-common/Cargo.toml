[package]
name    = "oxide-common"
version = "0.1.0"
edition = "2021"

[dependencies]
serde        = { workspace = true }
serde_json   = { workspace = true }
uuid         = { workspace = true }
rand         = { workspace = true }
hex          = { workspace = true }
anyhow       = { workspace = true }
chrono       = { workspace = true }
x25519-dalek      = { version = "2", features = ["static_secrets"] }
chacha20poly1305  = "0.10"
sha2              = "0.10"
hkdf              = "0.12"
strum             = { version = "0.26", features = ["derive"] }
strum_macros      = "0.26"
